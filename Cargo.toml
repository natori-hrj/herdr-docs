[package]
name = "herdr-docs"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "A beautiful, normalized document reader pane for Herdr"
license = "MIT"
repository = "https://github.com/natori-hrj/herdr-docs"
readme = "README.md"
keywords = ["herdr", "document", "reader", "tui"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }

[profile.release]
strip = true
lto = "thin"
