id = "herdr-docs"
name = "Herdr Docs"
version = "0.3.0"
min_herdr_version = "0.7.5"
description = "Read normalized documents in a calm, beautiful Herdr pane"
platforms = ["linux", "macos"]

[[build]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "scripts/build.sh"]

# Herdr does not put keybindings in the plugin manifest. This first-run hook mirrors
# herdr-lazy: it adds the reader action to the host config once, without overwriting conflicts.
[[startup]]
platforms = ["linux", "macos"]
command = ["./target/release/herdr-docs", "startup"]

[[actions]]
id = "open"
title = "Docs: open reader"
description = "Open the document reader in the current workspace"
contexts = ["workspace", "pane"]
command = ["/bin/sh", "scripts/open-reader.sh"]

[[panes]]
id = "reader"
title = "Herdr Docs"
placement = "overlay"
command = ["./target/release/herdr-docs", "reader"]
